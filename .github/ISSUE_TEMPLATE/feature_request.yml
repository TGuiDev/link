name: "💡 Sugestão de Funcionalidade"
description: "Sugira uma nova funcionalidade, melhoria ou ideia para o projeto Link."
title: "feat: "
labels:
  - "enhancement"
  - "proposal"
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir com novas ideias para o **Link**! Descreva sua proposta de forma clara e focada no valor agregado.

  - type: textarea
    id: problem_statement
    attributes:
      label: Qual problema ou necessidade esta proposta resolve?
      description: Explique o cenário atual onde essa funcionalidade faria a diferença.
      placeholder: Atualmente é difícil para criadores de conteúdo acompanhar cliques separados por campanha UTM...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Descrição da Solução Proposta
      description: Como você imagina que essa funcionalidade deve se comportar e ser apresentada ao usuário?
      placeholder: Adicionar uma aba no dashboard com quebra de cliques por parâmetros UTM (utm_source, utm_medium, utm_campaign)...
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternativas Consideradas
      description: Já pensou em outras abordagens ou soluções alternativas?
      placeholder: Criar múltiplos links curtos para cada variação de UTM manualmente...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Contexto Adicional ou Exemplos
      description: Adicione links, mockups, referências de outros serviços ou qualquer informação complementar.
    validations:
      required: false
